[package]
name = "typescript-core"
version = "0.8.5"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/Typescript"

[features]
# Packs carried inside the binary (Android, the CLI, the tests). The Windows text service
# reads the installed packs instead.
embedded-en = []
embedded-ko = []
embedded-ja = []
embedded-packs = ["embedded-en", "embedded-ko", "embedded-ja"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
typescript-core = { path = ".", features = ["embedded-packs"] }
typescript-packgen = { path = "../packgen" }

[build-dependencies]
typescript-packgen = { path = "../packgen" }
