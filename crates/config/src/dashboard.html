<!doctype html>
<html lang="ko">

<title>Typescript</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap");
:root {
  color-scheme: dark;
  --bg: #07090a; --fg: #e8ece9; --mute: #959e99; --line: #1d2421; --panel: #0c1110;

}
*, *::before, *::after { box-sizing: border-box; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
html { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: radial-gradient(60% 40% at 85% 0, #f4a26114, transparent 70%); }

.tagline { order: 3; flex-basis: 100%; margin: 6px 0 0; color: var(--mute); font-size: 15px; }
.ver { font: 12px var(--mono); color: var(--mute); }
.link { margin-left: auto; font: 12px var(--mono); color: var(--mute); display: flex; align-items: center; gap: 8px; }

.skip:focus { left: 12px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 4px; }
[role=tablist] { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 30px; overflow-x: auto; scrollbar-width: none; }
[role=tab] { appearance: none; background: none; border: 0; border-radius: 4px 4px 0 0; color: #b4beb8; font: 500 14px var(--sans); padding: 11px 15px; min-height: 44px; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, background .15s; }

.flow .arrow { color: var(--mute); }

.flow .chipl b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #ffffff10; font: 400 19px/1 var(--serif); }
.flow .cap { flex-basis: 100%; font-size: 13px; color: var(--mute); margin-top: 2px; }
.g-ko { color: var(--acc); } .g-ja { color: var(--info); } .g-en { color: var(--fg); }
.pill { font: 500 11px var(--mono); color: var(--bg); background: var(--mute); border-radius: 3px; padding: 0 6px; margin-right: 8px; vertical-align: 2px; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; } .seg .btn:first-child { border-radius: 4px 0 0 4px; } .seg .btn:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
.seg .btn:hover:not(:disabled) { transform: none; }
.emptybox { border: 1px dashed #ffffff2e; border-radius: 4px; padding: 26px; text-align: center; color: var(--mute); font-size: 14px; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: -1px; transition: border-color .2s, background .2s; }

.name { font: 500 17px var(--sans); }

.meta { color: var(--mute); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button.btn { appearance: none; font: 500 13px var(--sans); padding: 9px 15px; min-height: 40px; border-radius: 4px; border: 1px solid #ffffff2e; background: #ffffff0d; color: var(--fg); cursor: pointer; transition: background .2s, border-color .2s, transform .18s ease; }
button.btn:hover:not(:disabled) { background: #ffffff22; transform: translateY(-1px); }

button.btn.primary { background: #fff; color: #000; border-color: #fff; }
button.btn.primary:hover:not(:disabled) { background: #dfe5e1; }
button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); background: #ef6a5b14; }

button.btn.quiet:hover:not(:disabled) { color: var(--fg); background: #ffffff12; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: #fff; color: #000; padding: 11px 18px; border-radius: 4px; max-width: 90vw; font: 500 14px var(--sans); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #07090a; }
.banner { border: 1px solid var(--line); border-left: 2px solid var(--acc); background: var(--panel); padding: 12px 16px; margin-bottom: 18px; font-size: 14px; color: #c0c9c3; }
.banner.bad { border-left-color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 22px; }
.card.pad { padding: 22px; }
.setting { display: flex; align-items: center; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .text { flex: 1; min-width: 0; }
.setting .text b { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-weight: 500; font-size: 16px; }
.setting .text span { display: block; color: var(--mute); font-size: 14px; }
.setting .text em { display: block; font: normal 13px/1.7 var(--sans); color: #7f8984; margin-top: 4px; }
.tag { font: 500 10px var(--mono); letter-spacing: .04em; color: var(--acc); border: 1px solid #f4a26166; border-radius: 3px; padding: 0 6px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 13px; background: #1d2421; border: 1px solid #ffffff1f; transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #8a938e; transition: transform .2s, background .2s; }
.switch input:checked + i { background: #f4a26133; border-color: var(--acc); }
.switch input:checked + i::after { transform: translateX(18px); background: var(--acc); }
.switch input:focus-visible + i { outline: 2px solid var(--acc); outline-offset: 3px; }
select, input[type=text], textarea { font: 14px var(--sans); color: var(--fg); background: #080b0a; border: 1px solid #ffffff26; border-radius: 4px; padding: 9px 10px; min-height: 40px; }
select:hover, input[type=text]:hover, textarea:hover { border-color: #ffffff55; }
textarea { width: 100%; font: 17px/1.5 var(--mono); resize: vertical; min-height: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font: 12px var(--mono); }
.out { font: 400 clamp(24px, 4vw, 34px) / 1.5 var(--serif); margin: 4px 0 0; min-height: 52px; overflow-wrap: anywhere; white-space: pre-wrap; }
.w { border-bottom: 2px solid transparent; }
.w.l-ko { border-color: var(--acc); } .w.l-ja { border-color: var(--info); } .w.l-en { border-color: #ffffff2e; }
.w.l-mixed { border-color: var(--ok); }
.w.kept { border-bottom-style: dotted; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px var(--mono); color: var(--mute); margin-top: 14px; }
.legend i { display: inline-block; width: 14px; border-bottom: 2px solid; margin-right: 6px; vertical-align: 3px; }
.words { margin-top: 18px; }
.words .wr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.wr .k { font: 13px var(--mono); color: var(--mute); overflow-wrap: anywhere; }
.wr .conf { font: 12px var(--mono); color: var(--mute); }

.app { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; }
.app h3 { margin: 0; font: 500 16px var(--mono); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.app h3 .grow { flex: 1; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; min-height: 22px; }
.sum span { font: 12px var(--mono); color: #c0c9c3; background: #ffffff0f; border-radius: 3px; padding: 1px 8px; }
.sum .none { background: none; padding: 0; color: var(--mute); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--mute); }
.field select { width: 100%; color: var(--fg); font-size: 14px; }
.dd { position: relative; display: inline-block; min-width: 150px; }
.field .dd { display: block; }
.dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 14px var(--sans); color: var(--fg); text-align: left; background: #080b0a; border: 1px solid #ffffff26; border-radius: 4px; padding: 9px 12px; min-height: 40px; cursor: pointer; transition: border-color .15s, background .15s; }
.dd-btn:hover:not(:disabled) { border-color: #ffffff55; background: #0b100f; }
.dd-btn[aria-expanded=true] { border-color: var(--acc); }
.dd-caret { width: 7px; height: 7px; flex: none; border: solid var(--mute); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); transition: transform .18s; }
.dd-btn[aria-expanded=true] .dd-caret { transform: translateY(2px) rotate(225deg); border-color: var(--acc); }
.dd-menu { position: absolute; z-index: 30; left: 0; min-width: 100%; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none; max-height: 268px; overflow: auto; background: #0e1514; border: 1px solid #ffffff2e; border-radius: 6px; box-shadow: 0 16px 40px #000c; animation: pop .14s ease both; }
.dd-menu.right { left: auto; right: 0; }
.dd-menu.up { top: auto; bottom: calc(100% + 6px); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.dd-menu[hidden] { display: none; }
.dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 9px 10px; border-radius: 4px; font-size: 14px; white-space: nowrap; cursor: pointer; }
.dd-opt.active { background: #ffffff14; }
.dd-opt[aria-selected=true] { color: var(--acc); }
.dd-opt[aria-selected=true]::after { content: ""; width: 5px; height: 9px; flex: none; border: solid var(--acc); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.add { margin-top: 22px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.bar input { flex: 1 1 220px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; font: 12px var(--mono); color: var(--mute); }
.procs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.proc { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 8px 8px 14px; transition: border-color .2s; }
.proc:hover { border-color: #ffffff33; }
.proc code { font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc .dd { min-width: 128px; flex: none; }
.proc .dd-btn { min-height: 34px; padding: 5px 10px; font-size: 13px; }
#p-apps.dropping { outline: 2px dashed var(--acc); outline-offset: 10px; }
.add .pair { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.add input { flex: 1 1 240px; }
.skeleton { height: 76px; border: 1px solid var(--line); background: linear-gradient(100deg, var(--panel) 30%, #121a18 50%, var(--panel) 70%) 0 0 / 200% 100%; margin-bottom: -1px; animation: shine 1.4s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.empty { color: var(--mute); padding: 20px 0; }
pre.note { font: 12px/1.7 var(--mono); }
@media (max-width: 600px) {
  main { padding: 32px 14px 90px; }
  .row { grid-template-columns: 44px 1fr; padding: 16px; }
  .rank { font-size: 40px; }
  .actions { grid-column: 1 / -1; justify-content: flex-start; }
  .setting { flex-wrap: wrap; }
  .card { padding: 4px 16px; } .card.pad { padding: 16px; }
  .words .wr { grid-template-columns: 1fr auto; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
@media (forced-colors: active) {
  .switch i, .switch i::after { forced-color-adjust: none; }
  .switch input:checked + i::after { background: Highlight; }
  [role=tab][aria-selected=true] { border-bottom-color: Highlight; }
}
/* minimal, seamless: no boxes, only hairlines */
body { background: radial-gradient(50% 30% at 85% 0, #f4a2610d, transparent 70%); }

    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

let toastTimer;
function toast(text, bad) {
  const t = $("toast");
  t.textContent = text; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = "toast"; }, bad ? 6000 : 2500);

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": token, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error(data.error || ("요청이 거부되었습니다 (" + res.status + ")"));
  return data;
}

// `key` marks the control to give focus back to once the page is drawn again.
async function act(label, path, body, key) {
  if (busy) return;
  busy = true; pending = key || null; render(key);
  try { state = await api(path, body); if (label) toast(label); }
  catch (e) { toast(e.message, true); }
  busy = false; pending = null; render(key);
}

  act("순서를 바꿨습니다", "/api/languages", { action: "order", ids: order }, "mv-" + id + (delta < 0 ? "-up" : "-down"));
};

// A dropdown that looks like the rest of the page. `.value` is the chosen option's value;
// `onchange(value)` runs only when another option is chosen. Keys: Up Down Home End, Enter/Space, Esc.
let openDd = null, ddCount = 0;
function closeDd(refocus) {
  if (!openDd) return;
  openDd.menu.hidden = true; openDd.btn.setAttribute("aria-expanded", "false"); openDd.btn.removeAttribute("aria-activedescendant");
  if (refocus) openDd.btn.focus();
  openDd = null;
}
document.addEventListener("pointerdown", (e) => { if (openDd && !openDd.root.contains(e.target)) closeDd(false); });
function dd({ value, options, label, onchange, key, disabled, title }) {
  const id = "dd" + ++ddCount;
  let cur = Math.max(0, options.findIndex((o) => String(o[0]) === String(value))), active = cur;
  const val = h("span", {}, options[cur][1]);
  const btn = h("button", { type: "button", class: "dd-btn", "aria-haspopup": "listbox", "aria-expanded": "false", "aria-label": label + ": " + options[cur][1], "data-f": key, disabled, title }, val, h("i", { class: "dd-caret", "aria-hidden": "true" }));
  const items = options.map((o, i) => h("li", { role: "option", id: id + "-" + i, class: "dd-opt", "aria-selected": i === cur,
    onpointermove: () => mark(i), onclick: () => choose(i) }, o[1]));
  const menu = h("ul", { class: "dd-menu", role: "listbox", "aria-label": label, hidden: true }, items);
  const root = h("div", { class: "dd" }, btn, menu);
  Object.defineProperty(root, "value", { get: () => options[cur][0] });
  const self = { root, btn, menu };
  function mark(i) {
    active = Math.max(0, Math.min(options.length - 1, i));
    items.forEach((el, k) => el.classList.toggle("active", k === active));
    btn.setAttribute("aria-activedescendant", id + "-" + active);
    items[active].scrollIntoView({ block: "nearest" });
  }
  function open() {
    closeDd(false);
    menu.hidden = false; menu.classList.remove("up", "right");
    const r = btn.getBoundingClientRect();
    if (r.left + menu.offsetWidth > document.querySelector("main").getBoundingClientRect().right) menu.classList.add("right");
    if (r.bottom + menu.offsetHeight + 12 > innerHeight && r.top > menu.offsetHeight + 12) menu.classList.add("up");
    btn.setAttribute("aria-expanded", "true"); openDd = self; mark(cur);
  }
  function choose(i) {
    const changed = i !== cur;
    if (changed) { cur = i; val.textContent = options[i][1]; items.forEach((el, k) => el.setAttribute("aria-selected", k === i)); btn.setAttribute("aria-label", label + ": " + options[i][1]); }
    closeDd(true);
    if (changed && onchange) onchange(options[i][0]);
  }

  btn.addEventListener("keydown", (e) => {
    const isOpen = openDd === self;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!isOpen) open(); else mark(active + (e.key === "ArrowDown" ? 1 : -1)); }
    else if (e.key === "Home" && isOpen) { e.preventDefault(); mark(0); }
    else if (e.key === "End" && isOpen) { e.preventDefault(); mark(options.length - 1); }
    else if ((e.key === "Enter" || e.key === " ") && isOpen) { e.preventDefault(); choose(active); }
    else if (e.key === "Escape" && isOpen) { e.preventDefault(); e.stopPropagation(); closeDd(true); }
    else if (e.key === "Tab" && isOpen) closeDd(false);
  });
  return root;
}

function summary(rule) {
  const out = [];
  if (rule.enabled === false) out.push("꺼짐"); else if (rule.enabled === true) out.push("항상 켜짐");
  if (rule.conversionThreshold !== undefined) out.push(rule.conversionThreshold >= 0.97 ? "엄격 " + rule.conversionThreshold : "기준 " + rule.conversionThreshold);
  if (rule.escapeToApp !== undefined) out.push(rule.escapeToApp ? "Esc는 앱에게" : "Esc는 변환 전환");
  if (rule.useSystemIme !== undefined) out.push(rule.useSystemIme ? "시스템 IME" : "자체 입력기");
  if (rule.fullWidth !== undefined) out.push(rule.fullWidth ? "일본어 전각" : "전각 안 씀");
  return out;
}

function appCard(exe, rule) {
  const edit = (patch, key) => {
    const next = JSON.parse(JSON.stringify(state.apps));
    const r = { ...(next[exe] || {}), ...patch };
    for (const k of Object.keys(r)) if (r[k] === undefined) delete r[k];
    next[exe] = r; saveApps(next, key);
  };
  const sel = (key, label, hint) => h("div", { class: "field" }, h("span", {}, label),
    dd({ key: "app-" + exe + "-" + key, label: exe + " " + label, disabled: busy, title: hint, value: tri(rule[key]), options: TRI,
      onchange: (v) => edit({ [key]: triVal(v) }, "app-" + exe + "-" + key) }));
  const th = rule.conversionThreshold;
  const thOpts = [["", "기본 0.5"], ["0.97", "엄격 0.97"]];
  if (th !== undefined && th !== 0.97) thOpts.push([String(th), "직접 " + th]);
  const thSel = h("div", { class: "field" }, h("span", {}, "변환 기준"),
    dd({ key: "app-" + exe + "-th", label: exe + " 변환 기준", disabled: busy, title: "높을수록 확실할 때만 바꿉니다", value: th === undefined ? "" : String(th), options: thOpts,
      onchange: (v) => edit({ conversionThreshold: v === "" ? undefined : Number(v) }, "app-" + exe + "-th") }));
  const sum = summary(rule);
  const star = exe === "*";
  const presetSel = dd({ key: "app-" + exe + "-preset", label: exe + " 프리셋 적용", disabled: busy, value: "",
    options: [["", "프리셋 적용…"], ...PRESETS.map((x, i) => [String(i), x[0]])],
    onchange: (v) => { if (v !== "") edit(PRESETS[v][1], "app-" + exe + "-th"); } });
  return h("article", { class: "app", "aria-label": star ? "모든 앱" : exe },
    h("h3", {}, star ? "모든 앱 (*)" : exe, h("span", { class: "grow" }), presetSel,

    h("div", { class: "sum" }, sum.length ? sum.map((t) => h("span", {}, t)) : h("span", { class: "none" }, star ? "특별한 규칙 없음 — 기본 동작" : "모두 ‘기본’ — 모든 앱 규칙을 따릅니다")),
    h("div", { class: "fields" }, sel("enabled", "사용"), thSel, sel("escapeToApp", "Esc는 앱에게"), sel("useSystemIme", "시스템 IME"), sel("fullWidth", "일본어 전각")));
}

let runningApps = null, loadingApps = false, appFilter = "", appPage = 0;
const PAGE_SIZE = 12;
const blankRule = "blank";
async function loadRunning() {
  if (loadingApps) return;
  loadingApps = true; if (state) renderApps();
  try { runningApps = (await api("/api/processes")).apps; } catch (e) { runningApps = []; toast(e.message, true); }
  loadingApps = false; if (state) renderApps();
}

function addApp(name, rule, quiet) {
  const n = name.trim().toLowerCase();
  if (!n) return;
  if (!/^[^\\/:*?"<>|]+$/.test(n)) { toast("파일 이름만 적어 주세요 (경로 없이)", true); return; }
  if (state.apps[n]) { if (!quiet) toast("이미 있는 앱입니다", true); return; }
  saveApps({ ...state.apps, [n]: rule }, "app-" + n + "-th");
}

function procList() {
  const box = h("div", {});

  const all = (runningApps || []).filter((a) => !state.apps[a] && a.includes(q));
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  appPage = Math.min(appPage, pages - 1);
  const rows = all.slice(appPage * PAGE_SIZE, (appPage + 1) * PAGE_SIZE);
  const grid = h("div", { class: "procs" });
  if (loadingApps && !runningApps) grid.replaceChildren(h("div", { class: "skeleton" }), h("div", { class: "skeleton" }));
  else if (!all.length) grid.replaceChildren(h("div", { class: "emptybox", style: "grid-column:1/-1" }, h("b", {}, q ? "찾는 앱이 없습니다" : "규칙을 추가할 앱이 없습니다"), q ? "다른 이름으로 찾거나, 아래에서 파일 이름을 직접 적어 주세요." : "열려 있는 프로그램이 여기에 나옵니다."));

      onchange: (v) => addApp(a, v === blankRule ? {} : { ...PRESETS[v][1] }) }))));
  box.append(grid);
  if (pages > 1) {
    const go = (d) => { appPage += d; box.replaceWith(procList()); };
    box.append(h("div", { class: "pager" },
      h("button", { class: "btn quiet", disabled: appPage === 0, "aria-label": "이전 페이지", onclick: () => go(-1) }, "←"),
      h("span", { role: "status" }, (appPage + 1) + " / " + pages + " · " + all.length + "개"),

  }
  return box;
}

  input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  p.append(h("div", { class: "card pad" },
    h("div", { class: "note", style: "margin:0 0 10px" }, "목록에 없으면 파일 이름을 적거나, .exe 파일을 이 화면으로 끌어다 놓으세요."),
    h("div", { class: "pair", style: "display:flex;flex-wrap:wrap;gap:8px" }, input, preset, h("button", { class: "btn primary", disabled: busy, onclick: add }, "추가"))));
}

const appsPanel = () => $("p-apps");
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { if (!appsPanel().hidden && e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { e.preventDefault(); appsPanel().classList.add("dropping"); } }));
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) appsPanel().classList.remove("dropping"); });
document.addEventListener("drop", (e) => {
  appsPanel().classList.remove("dropping");
  if (appsPanel().hidden || !state) return;
  e.preventDefault();
  const names = [...(e.dataTransfer ? e.dataTransfer.files : [])].map((f) => f.name).filter((n) => n.toLowerCase().endsWith(".exe"));
  if (!names.length) { toast(".exe 파일을 끌어다 놓아 주세요", true); return; }
  addApp(names[0], {});
});

function renderUpdate() {
  const p = $("p-upd"); p.replaceChildren();
  p.append(h("h2", {}, "현재 버전"), h("div", { class: "card pad" }, h("b", {}, "Typescript " + state.version)));
  p.append(h("h2", {}, "새 버전"));
  const box = h("div", { class: "card pad", "aria-busy": busy && pending === "upd" });
  if (!updateInfo) box.append(h("p", { class: "note" }, "GitHub 릴리스에서 새 버전과 언어 팩 갱신을 확인합니다."));
  else if (updateInfo.error) box.append(h("p", { class: "note", role: "alert" }, updateInfo.error));
  else if (!updateInfo.available) box.append(h("p", { class: "note" }, "최신 버전입니다."));
  else {
    box.append(h("b", {}, updateInfo.latest + " 이(가) 나왔습니다"));
    if (updateInfo.notes) box.append(h("pre", { class: "note", style: "white-space:pre-wrap" }, updateInfo.notes));
    box.append(h("button", { class: "btn primary", disabled: busy, onclick: applyUpdate }, updateInfo.coreChanged ? "업데이트 (관리자 확인창이 한 번 뜹니다)" : "언어 팩 업데이트"));
  }
  box.append(h("div", { style: "margin-top:14px" }, h("button", { class: "btn", "data-f": "upd-check", disabled: busy, onclick: checkUpdate }, busy && pending === "upd" ? "확인 중…" : "지금 확인")));
  p.append(box);
}

async function checkUpdate() {
  busy = true; pending = "upd"; render("upd-check");
  try { updateInfo = await api("/api/update"); } catch (e) { updateInfo = { error: e.message }; }
  busy = false; pending = null; render("upd-check");
}
async function applyUpdate() {
  busy = true; pending = "upd"; render();
  try { const r = await api("/api/update", { action: "apply" }); toast(r.message || "업데이트했습니다"); updateInfo = null; state = await api("/api/state"); }
  catch (e) { toast(e.message, true); }
  busy = false; pending = null; render();
}

// ---- 체험: type on a QWERTY keyboard, see what each word becomes.
const tryState = { text: "", app: "*", seq: 0, timer: 0, order: "" };
const SAMPLES = [["dkssudgktpdy hello world", "한글 + 영어"], ["rkskek git commit -m", "코드 사이에서"], ["kyouhaiitenkidesune", "일본어", "ja"]];

function threshold() {
  const r = (state.apps[tryState.app] || {}), star = state.apps["*"] || {};
  return r.conversionThreshold !== undefined ? r.conversionThreshold : star.conversionThreshold;
}

function scheduleTry() { clearTimeout(tryState.timer); tryState.timer = setTimeout(runTry, 180); }

let lastOut = "";
async function runTry() {
  const units = $("try-units");
  if (!units) return;
  const mine = ++tryState.seq;
  if (!tryState.text.trim()) { lastOut = ""; units.replaceChildren(h("span", { class: "idle" }, "여기에 읽힌 결과가 나타납니다")); $("try-copy").disabled = true; return; }
  let r;
  try { r = await api("/api/try", { text: tryState.text, ...(threshold() !== undefined ? { threshold: threshold() } : {}) }); }
  catch (e) { if (mine === tryState.seq) units.replaceChildren(h("span", { class: "idle", role: "alert" }, e.message)); return; }
  if (mine !== tryState.seq) return; // a newer keystroke is already on its way
  lastOut = r.segments.map((x) => (x.keys ? x.out : x.text)).join("");
  $("try-copy").disabled = false;
  units.replaceChildren(...r.segments.flatMap((x) => {
    if (x.keys) {
      return [h("div", { class: "unit l-" + x.lang + (x.kept ? " kept" : ""), title: x.kept ? "확신이 부족해 그대로 둠" : x.why },
        h("span", { class: "u-out" }, x.out),
        h("span", { class: "u-meta" }, x.keys + "  " + (GLYPH[x.lang] || x.lang) + " " + Math.round(x.confidence * 100)),
        h("span", { class: "u-bar" }, h("i", { style: "width:" + Math.round(x.confidence * 100) + "%" })))];
    }
    if (x.text.includes(String.fromCharCode(10))) return [h("div", { class: "br" })];
    return x.text.trim() ? [h("span", { class: "sep" }, x.text.trim())] : [];
  }));
}

function buildTry() {
  const p = $("p-try");
  const area = h("textarea", { id: "try-in", class: "try-in", rows: 2, spellcheck: "false", autocomplete: "off", "aria-label": "영문 자판으로 친 글", placeholder: "dkssudgktpdy hello world",
    oninput: (e) => { tryState.text = e.target.value; scheduleTry(); } });
  p.append(h("div", { class: "try" },
    h("label", { class: "cap", for: "try-in" }, "영문 자판으로 그냥 치세요"), area,
    h("div", { class: "try-samples", id: "try-chips" }),
    h("div", { class: "try-rule", "aria-hidden": "true" }, h("span", {}, "읽힌 결과")),
    h("div", { class: "units", id: "try-units", "aria-live": "polite" }),
    h("div", { class: "try-foot" },
      h("span", { id: "try-app" }), h("span", { class: "grow" }),
      h("button", { class: "btn quiet", id: "try-copy", disabled: true, onclick: async () => { try { await navigator.clipboard.writeText(lastOut); toast("복사했습니다"); } catch (e) { toast("복사하지 못했습니다", true); } } }, "결과 복사")),
    h("p", { class: "note", style: "margin-top:26px" }, "단어마다 읽은 언어와 확신도(%)를 보여 줍니다. 점선은 확신이 부족해 그대로 둔 단어입니다. 실제 입력에서는 앞 단어와 기록한 단어도 영향을 줍니다.")));
}

function updateTry() {
  const app = $("try-app"), chips = $("try-chips");
  if (!app) return;
  const names = ["*", ...Object.keys(state.apps).filter((k) => k !== "*").sort()];
  if (!names.includes(tryState.app)) tryState.app = "*";
  app.replaceChildren(dd({ label: "적용할 앱 규칙", value: tryState.app, options: names.map((n) => [n, n === "*" ? "모든 앱 기준" : n + " 기준"]), onchange: (v) => { tryState.app = v; scheduleTry(); } }));
  chips.replaceChildren(h("span", {}, "예시"), ...SAMPLES.filter((x) => !x[2] || state.order.includes(x[2])).map((x) => h("button", { class: "linkbtn", onclick: () => { $("try-in").value = x[0]; tryState.text = x[0]; runTry(); $("try-in").focus(); } }, x[0])));
  const order = state.order.join();
  if (order !== tryState.order) { tryState.order = order; runTry(); }
}

function render(focusKey) {
  if (!state) return;
  openDd = null;
  $("ver").textContent = "v" + state.version;
  const active = focusKey || (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f);
  renderLang(); renderSettings(); renderApps(); renderUpdate(); updateTry();
  if (active) { const el = document.querySelector('[data-f="' + CSS.escape(active) + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}

// On the 체험 tab, typing anywhere goes into the input (like a terminal).
const tryActive = () => !$("p-try").hidden && !openDd;
const editable = (el) => el && (["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName) || el.isContentEditable);
document.addEventListener("keydown", (e) => {
  if (!tryActive() || e.ctrlKey || e.metaKey || e.altKey || editable(e.target)) return;
  const typing = e.key.length === 1 || e.key === "Backspace";
  // A focused button keeps Space and Enter; letters are free.
  if (!typing || (e.target.tagName === "BUTTON" && e.key === " ")) return;
  $("try-in").focus();
});
document.addEventListener("paste", (e) => {
  if (!tryActive() || editable(e.target)) return;
  const text = e.clipboardData && e.clipboardData.getData("text");
  if (!text) return;
  e.preventDefault();
  const area = $("try-in"); area.focus(); area.setRangeText(text, area.selectionStart, area.selectionEnd, "end");
  area.dispatchEvent(new Event("input"));
});

const tabs = ["t-lang", "t-try", "t-set", "t-apps", "t-upd"], panels = ["p-lang", "p-try", "p-set", "p-apps", "p-upd"];
function select(i, focus) {
  tabs.forEach((t, k) => { $(t).setAttribute("aria-selected", k === i); $(t).tabIndex = k === i ? 0 : -1; $(panels[k]).hidden = k !== i; });
  if (focus) $(tabs[i]).focus();
  history.replaceState(null, "", "/#" + tabs[i].slice(2));
  if (i === 1 && state) runTry();
  if (i === 3 && runningApps === null) loadRunning();
}
tabs.forEach((t, i) => {
  $(t).addEventListener("click", () => select(i, true));
  $(t).addEventListener("keydown", (e) => {
    const to = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); select(to, true); }
  });
});

async function beat() {
  try { await api("/api/heartbeat", {}); $("dot").className = "dot"; $("linktext").textContent = "연결됨"; }
  catch (e) { $("dot").className = "dot off"; $("linktext").textContent = "끊어짐 — 터미널에서 다시 여세요"; }
}
setInterval(beat, 5000);

(async () => {
  buildTry();
  const start = tabs.indexOf("t-" + location.hash.slice(1));
  if (start > 0) select(start, false);
  try { state = await api("/api/state"); render(); if (!$("p-apps").hidden) loadRunning(); }
  catch (e) { $("p-lang").replaceChildren(h("div", { class: "banner bad", role: "alert" }, e.message + " 터미널에서 typescript-config 를 다시 실행해 주세요.")); }
})();
</script>
</body>
</html>
