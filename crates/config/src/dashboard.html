<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Typescript</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap");
:root {
  color-scheme: dark;
  --bg: #07090a; --fg: #e8ece9; --mute: #959e99; --line: #1d2421; --panel: #0c1110;
  --acc: #f4a261; --ok: #6fd08c; --bad: #ef6a5b; --info: #7cb7ff;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, "D2Coding", monospace;
  --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --serif: "Instrument Serif", "Times New Roman", serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: radial-gradient(60% 40% at 85% 0, #f4a26114, transparent 70%); }
main { max-width: 860px; margin: 0 auto; padding: 56px 20px 110px; }
header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 30px; }
h1 { margin: 0; font: 400 clamp(40px, 6vw, 64px) / 1 var(--serif); letter-spacing: -0.03em; }
.ver { font: 12px var(--mono); color: var(--mute); }
.link { margin-left: auto; font: 12px var(--mono); color: var(--mute); display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); transition: background .3s; }
.dot.off { background: var(--bad); }
.skip { position: absolute; left: -999px; top: 8px; background: #fff; color: #000; padding: 8px 14px; border-radius: 4px; z-index: 9; }
.skip:focus { left: 12px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 4px; }
[role=tablist] { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 30px; overflow-x: auto; scrollbar-width: none; }
[role=tab] { appearance: none; background: none; border: 0; border-radius: 4px 4px 0 0; color: #b4beb8; font: 500 14px var(--sans); padding: 11px 15px; min-height: 44px; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, background .15s; }
[role=tab]:hover { color: #fff; background: #ffffff12; }
[role=tab][aria-selected=true] { color: #fff; border-bottom-color: var(--acc); }
h2 { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 38px 0 14px; }
h2:first-child { margin-top: 0; }
.note { color: var(--mute); font-size: 14px; margin: 0 0 16px; max-width: 64ch; }
.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: -1px; transition: border-color .2s, background .2s; }
.row:hover { border-color: #ffffff33; background: #0e1514; }
.row[aria-busy=true] { border-color: var(--acc); }
.rank { font: 400 52px/1 var(--serif); color: var(--acc); letter-spacing: -0.03em; text-align: center; }
.rank.off { color: #3a4541; }
.name { font: 500 17px var(--sans); }
.name small { font: 11px var(--mono); color: var(--mute); margin-left: 10px; }
.meta { color: var(--mute); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button.btn { appearance: none; font: 500 13px var(--sans); padding: 9px 15px; min-height: 40px; border-radius: 4px; border: 1px solid #ffffff2e; background: #ffffff0d; color: var(--fg); cursor: pointer; transition: background .2s, border-color .2s, transform .18s ease; }
button.btn:hover:not(:disabled) { background: #ffffff22; transform: translateY(-1px); }
button.btn:active:not(:disabled) { transform: none; }
button.btn.primary { background: #fff; color: #000; border-color: #fff; }
button.btn.primary:hover:not(:disabled) { background: #dfe5e1; }
button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); background: #ef6a5b14; }
button.btn.quiet { border-color: transparent; background: none; color: var(--mute); padding: 6px 10px; min-height: 32px; }
button.btn.quiet:hover:not(:disabled) { color: var(--fg); background: #ffffff12; }
button:disabled { opacity: .4; cursor: not-allowed; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: #fff; color: #000; padding: 11px 18px; border-radius: 4px; max-width: 90vw; font: 500 14px var(--sans); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #07090a; }
.banner { border: 1px solid var(--line); border-left: 2px solid var(--acc); background: var(--panel); padding: 12px 16px; margin-bottom: 18px; font-size: 14px; color: #c0c9c3; }
.banner.bad { border-left-color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 22px; }
.card.pad { padding: 22px; }
.setting { display: flex; align-items: center; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .text { flex: 1; min-width: 0; }
.setting .text b { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-weight: 500; font-size: 16px; }
.setting .text span { display: block; color: var(--mute); font-size: 14px; }
.setting .text em { display: block; font: normal 12px/1.7 var(--mono); color: #7f8984; margin-top: 4px; }
.tag { font: 500 10px var(--mono); letter-spacing: .04em; color: var(--acc); border: 1px solid #f4a26166; border-radius: 3px; padding: 0 6px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 13px; background: #1d2421; border: 1px solid #ffffff1f; transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #8a938e; transition: transform .2s, background .2s; }
.switch input:checked + i { background: #f4a26133; border-color: var(--acc); }
.switch input:checked + i::after { transform: translateX(18px); background: var(--acc); }
.switch input:focus-visible + i { outline: 2px solid var(--acc); outline-offset: 3px; }
select, input[type=text], textarea { font: 14px var(--sans); color: var(--fg); background: #080b0a; border: 1px solid #ffffff26; border-radius: 4px; padding: 9px 10px; min-height: 40px; }
select:hover, input[type=text]:hover, textarea:hover { border-color: #ffffff55; }
textarea { width: 100%; font: 17px/1.5 var(--mono); resize: vertical; min-height: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font: 12px var(--mono); }
.out { font: 400 clamp(24px, 4vw, 34px) / 1.5 var(--serif); margin: 4px 0 0; min-height: 52px; overflow-wrap: anywhere; white-space: pre-wrap; }
.w { border-bottom: 2px solid transparent; }
.w.l-ko { border-color: var(--acc); } .w.l-ja { border-color: var(--info); } .w.l-en { border-color: #ffffff2e; }
.w.l-mixed { border-color: var(--ok); }
.w.kept { border-bottom-style: dotted; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px var(--mono); color: var(--mute); margin-top: 14px; }
.legend i { display: inline-block; width: 14px; border-bottom: 2px solid; margin-right: 6px; vertical-align: 3px; }
.words { margin-top: 18px; }
.words .wr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.wr .k { font: 13px var(--mono); color: var(--mute); overflow-wrap: anywhere; }
.wr .conf { font: 12px var(--mono); color: var(--mute); }
.apps { display: grid; gap: 14px; }
.app { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; }
.app h3 { margin: 0; font: 500 16px var(--mono); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.app h3 .grow { flex: 1; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; min-height: 22px; }
.sum span { font: 12px var(--mono); color: #c0c9c3; background: #ffffff0f; border-radius: 3px; padding: 1px 8px; }
.sum .none { background: none; padding: 0; color: var(--mute); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--mute); }
.field select { width: 100%; color: var(--fg); font-size: 14px; }
.add { margin-top: 22px; }
.add .pair { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.add input { flex: 1 1 240px; }
.skeleton { height: 76px; border: 1px solid var(--line); background: linear-gradient(100deg, var(--panel) 30%, #121a18 50%, var(--panel) 70%) 0 0 / 200% 100%; margin-bottom: -1px; animation: shine 1.4s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.empty { color: var(--mute); padding: 20px 0; }
pre.note { font: 12px/1.7 var(--mono); }
@media (max-width: 600px) {
  main { padding: 32px 14px 90px; }
  .row { grid-template-columns: 44px 1fr; padding: 16px; }
  .rank { font-size: 40px; }
  .actions { grid-column: 1 / -1; justify-content: flex-start; }
  .setting { flex-wrap: wrap; }
  .card { padding: 4px 16px; } .card.pad { padding: 16px; }
  .words .wr { grid-template-columns: 1fr auto; }
  .words .wr .k { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
@media (forced-colors: active) {
  .switch i, .switch i::after { forced-color-adjust: none; }
  .switch input:checked + i::after { background: Highlight; }
  [role=tab][aria-selected=true] { border-bottom-color: Highlight; }
}
</style>
</head>
<body>
<a class="skip" href="#panels">본문으로 건너뛰기</a>
<main>
  <header>
    <h1>Typescript</h1><span class="ver" id="ver"></span>
    <span class="link" role="status"><span class="dot" id="dot"></span><span id="linktext">연결됨</span></span>
  </header>
  <div role="tablist" aria-label="설정">
    <button role="tab" id="t-lang" aria-controls="p-lang" aria-selected="true">언어</button>
    <button role="tab" id="t-try" aria-controls="p-try" aria-selected="false" tabindex="-1">체험</button>
    <button role="tab" id="t-set" aria-controls="p-set" aria-selected="false" tabindex="-1">입력 설정</button>
    <button role="tab" id="t-apps" aria-controls="p-apps" aria-selected="false" tabindex="-1">앱별 규칙</button>
    <button role="tab" id="t-upd" aria-controls="p-upd" aria-selected="false" tabindex="-1">업데이트</button>
  </div>
  <div id="panels">
    <section id="p-lang" role="tabpanel" aria-labelledby="t-lang" tabindex="-1"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <section id="p-try" role="tabpanel" aria-labelledby="t-try" tabindex="-1" hidden></section>
    <section id="p-set" role="tabpanel" aria-labelledby="t-set" tabindex="-1" hidden></section>
    <section id="p-apps" role="tabpanel" aria-labelledby="t-apps" tabindex="-1" hidden></section>
    <section id="p-upd" role="tabpanel" aria-labelledby="t-upd" tabindex="-1" hidden></section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
let token = params.get("t") || sessionStorage.getItem("ts-token") || "";
if (params.get("t")) { sessionStorage.setItem("ts-token", token); history.replaceState(null, "", "/" + location.hash); }

let state = null, busy = false, pending = null, updateInfo = null;
const $ = (id) => document.getElementById(id);

// Every value from the server goes in as text, never as markup.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

let toastTimer;
function toast(text, bad) {
  const t = $("toast");
  t.textContent = text; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = "toast"; }, bad ? 6000 : 2500);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": token, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error(data.error || ("요청이 거부되었습니다 (" + res.status + ")"));
  return data;
}

// `key` marks the control to give focus back to once the page is drawn again.
async function act(label, path, body, key) {
  if (busy) return;
  busy = true; pending = key || null; render(key);
  try { state = await api(path, body); if (label) toast(label); }
  catch (e) { toast(e.message, true); }
  busy = false; pending = null; render(key);
}

const move = (id, delta) => {
  const order = state.order.slice(), i = order.indexOf(id), j = i + delta;
  if (j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  act("순서를 바꿨습니다", "/api/languages", { action: "order", ids: order }, "mv-" + id + (delta < 0 ? "-up" : "-down"));
};

const GLYPH = { en: "A", ko: "가", ja: "あ" };
const mb = (n) => (n / 1048576).toFixed(1) + " MB";
const langName = (id) => (state && state.languages.find((l) => l.id === id) || {}).name || (id === "mixed" ? "혼합" : id);

function langRow(l, position) {
  const on = position != null, working = pending === "lang-" + l.id;
  const actions = [];
  if (on) {
    actions.push(h("button", { class: "btn", "data-f": "mv-" + l.id + "-up", disabled: busy || position === 0, "aria-label": l.name + " 위로", onclick: () => move(l.id, -1) }, "↑"));
    actions.push(h("button", { class: "btn", "data-f": "mv-" + l.id + "-down", disabled: busy || position === state.order.length - 1, "aria-label": l.name + " 아래로", onclick: () => move(l.id, 1) }, "↓"));
    actions.push(h("button", {
      class: "btn danger", "data-f": "lang-" + l.id, disabled: busy || state.order.length < 2, title: state.order.length < 2 ? "하나는 켜 두어야 합니다" : "",
      onclick: () => act(l.name + "을(를) 껐습니다", "/api/languages", { action: "remove", id: l.id }, "lang-" + l.id),
    }, "끄기"));
  } else if (l.installed) {
    actions.push(h("button", { class: "btn primary", "data-f": "lang-" + l.id, disabled: busy, onclick: () => act(l.name + "을(를) 켰습니다", "/api/languages", { action: "add", id: l.id }, "lang-" + l.id) }, "켜기"));
  } else {
    actions.push(h("button", { class: "btn primary", "data-f": "lang-" + l.id, disabled: busy, onclick: () => act(l.name + "을(를) 받았습니다", "/api/languages", { action: "add", id: l.id }, "lang-" + l.id) }, working ? "받는 중…" : "받기 · " + mb(l.size)));
  }
  const status = on ? (l.installed ? "켜짐 · " + l.version : "팩이 없습니다") : (l.installed ? "받아 둠 · " + l.version : "받을 수 있음");
  const needs = l.requiredBy.length ? " · " + l.requiredBy.join(", ") + "이(가) 이 데이터를 씁니다" : "";
  return h("div", { class: "row", "aria-busy": working },
    h("div", { class: "rank" + (on ? "" : " off"), "aria-hidden": "true" }, on ? position + 1 : GLYPH[l.id] || "·"),
    h("div", {}, h("div", { class: "name" }, l.name, h("small", {}, l.id)), h("div", { class: "meta" }, (on ? position + 1 + "번째 · " : "") + status + needs)),
    h("div", { class: "actions" }, actions));
}

function renderLang() {
  const p = $("p-lang"); p.replaceChildren();
  if (state.catalogError) p.append(h("div", { class: "banner bad", role: "alert" }, "릴리스 목록을 불러오지 못해서 설치된 언어만 보입니다. " + state.catalogError));
  for (const why of state.problems) p.append(h("div", { class: "banner bad", role: "alert" }, "쓸 수 없는 팩: " + why));
  p.append(h("h2", {}, "켜진 언어 · Esc 순서"));
  p.append(h("p", { class: "note" }, "단어에서 Esc를 누르면 이 순서대로 읽기가 바뀝니다. 하나는 켜 두어야 합니다. ‘체험’ 탭에서 바로 쳐 볼 수 있습니다."));
  const byId = Object.fromEntries(state.languages.map((l) => [l.id, l]));
  state.order.forEach((id, i) => { if (byId[id]) p.append(langRow(byId[id], i)); });
  const rest = state.languages.filter((l) => !state.order.includes(l.id));
  p.append(h("h2", {}, "더 쓸 수 있는 언어"));
  if (!rest.length) p.append(h("div", { class: "empty" }, "모두 켜져 있습니다."));
  rest.forEach((l) => p.append(langRow(l, null)));
}

// [key, title, what it does, example, language it needs]
const SETTINGS = [
  ["기본", [
    ["returnConfirmsOnly", "Enter는 확정만", "밑줄 단어에서 Enter를 누르면 단어만 확정하고, 다음 Enter가 앱으로 갑니다.", "켬: dkssud ⏎ → 안녕 (줄바꿈 없음) ⏎ → 줄바꿈 · 끔: ⏎ 한 번에 확정 + 줄바꿈"],
    ["autocomplete", "Tab 자동완성과 단어 기록", "쓰는 중인 단어를 자주 쓴 단어로 완성하고, 확정한 단어를 셉니다.", "hel 까지 치고 Tab → hello"],
    ["pauseKey", "일시정지 키", "누르면 변환을 잠시 멈추고 쓴 그대로 입력합니다.", ""],
  ]],
  ["일본어", [
    ["liveConversion", "치는 동안 바로 변환", "Space 전에도 첫 후보를 보여 줍니다.", "kyouha → 今日は (Space 없이)", "ja"],
    ["fullWidthDigits", "일본어 뒤 숫자는 전각", "일본어 문장 뒤에 이어 치는 숫자를 전각으로 씁니다.", "３月 ０３－１２３４", "ja"],
    ["fullWidthSpace", "일본어 뒤 공백은 전각", "Shift+Space로 반대 폭을 씁니다.", "東京　大阪 (전각 공백)", "ja"],
  ]],
  ["업데이트", [["checkUpdates", "새 버전 확인", "대시보드나 명령을 실행할 때 하루에 한 번 새 릴리스가 있는지 봅니다.", ""]]],
];

function setting(key, title, desc, example) {
  const v = state.settings[key], changed = v !== state.defaults[key];
  const control = key === "pauseKey"
    ? h("select", { "data-f": key, "aria-label": title, onchange: (e) => act("저장했습니다", "/api/settings", { pauseKey: e.target.value }, key) },
        h("option", { value: "hangul", selected: v === "hangul" }, "한/영 키"), h("option", { value: "off", selected: v === "off" }, "사용 안 함"))
    : h("label", { class: "switch" },
        h("input", { type: "checkbox", "data-f": key, checked: v, "aria-label": title, onchange: (e) => act("저장했습니다", "/api/settings", { [key]: e.target.checked }, key) }), h("i"));
  const reset = changed ? h("button", { class: "btn quiet", "data-f": key + "-reset", disabled: busy, "aria-label": title + " 기본값으로", onclick: () => act("기본값으로 되돌렸습니다", "/api/settings", { [key]: state.defaults[key] }, key) }, "기본값으로") : null;
  return h("div", { class: "setting" },
    h("div", { class: "text" }, h("b", {}, title, changed ? h("span", { class: "tag" }, "기본값 아님") : null), desc ? h("span", {}, desc) : null, example ? h("em", {}, example) : null),
    reset, control);
}

function renderSettings() {
  const p = $("p-set"); p.replaceChildren();
  for (const [group, items] of SETTINGS) {
    const shown = items.filter((it) => !it[4] || state.order.includes(it[4]));
    if (!shown.length) continue;
    p.append(h("h2", {}, group), h("div", { class: "card" }, shown.map((it) => setting(it[0], it[1], it[2], it[3]))));
  }
  p.append(h("p", { class: "note", style: "margin-top:18px" }, "바꾸면 바로 저장되고, 열려 있는 앱에는 곧 반영됩니다."));
}

const TRI = [["", "기본"], ["true", "켜기"], ["false", "끄기"]];
const tri = (v) => (v === true ? "true" : v === false ? "false" : "");
const triVal = (s) => (s === "" ? undefined : s === "true");
const PRESETS = [
  ["터미널 · 엄격", { conversionThreshold: 0.97 }],
  ["게임 · 끄기", { enabled: false }],
  ["vim · 에디터", { escapeToApp: true }],
  ["카카오톡 · 시스템 IME", { useSystemIme: true }],
];

function saveApps(apps, key) { return act("저장했습니다", "/api/apps", apps, key); }

function summary(rule) {
  const out = [];
  if (rule.enabled === false) out.push("꺼짐"); else if (rule.enabled === true) out.push("항상 켜짐");
  if (rule.conversionThreshold !== undefined) out.push(rule.conversionThreshold >= 0.97 ? "엄격 " + rule.conversionThreshold : "기준 " + rule.conversionThreshold);
  if (rule.escapeToApp !== undefined) out.push(rule.escapeToApp ? "Esc는 앱에게" : "Esc는 변환 전환");
  if (rule.useSystemIme !== undefined) out.push(rule.useSystemIme ? "시스템 IME" : "자체 입력기");
  if (rule.fullWidth !== undefined) out.push(rule.fullWidth ? "일본어 전각" : "전각 안 씀");
  return out;
}

function appCard(exe, rule) {
  const edit = (patch, key) => {
    const next = JSON.parse(JSON.stringify(state.apps));
    const r = { ...(next[exe] || {}), ...patch };
    for (const k of Object.keys(r)) if (r[k] === undefined) delete r[k];
    next[exe] = r; saveApps(next, key);
  };
  const sel = (key, label, hint) => h("label", { class: "field" }, label,
    h("select", { "data-f": "app-" + exe + "-" + key, disabled: busy, title: hint || "", onchange: (e) => edit({ [key]: triVal(e.target.value) }, "app-" + exe + "-" + key) },
      TRI.map(([v, t]) => h("option", { value: v, selected: tri(rule[key]) === v }, t))));
  const th = rule.conversionThreshold;
  const thSel = h("label", { class: "field" }, "변환 기준",
    h("select", { "data-f": "app-" + exe + "-th", disabled: busy, title: "높을수록 확실할 때만 바꿉니다", onchange: (e) => edit({ conversionThreshold: e.target.value === "" ? undefined : Number(e.target.value) }, "app-" + exe + "-th") },
      h("option", { value: "", selected: th === undefined }, "기본 0.5"), h("option", { value: "0.97", selected: th === 0.97 }, "엄격 0.97"),
      th !== undefined && th !== 0.97 ? h("option", { value: String(th), selected: true }, "직접 " + th) : null));
  const sum = summary(rule);
  const star = exe === "*";
  const presetSel = h("select", { "aria-label": exe + " 프리셋 적용", disabled: busy, onchange: (e) => { const p = PRESETS[e.target.value]; e.target.value = ""; if (p) edit(p[1], "app-" + exe + "-th"); } },
    h("option", { value: "" }, "프리셋 적용…"), PRESETS.map((p, i) => h("option", { value: i }, p[0])));
  return h("article", { class: "app", "aria-label": star ? "모든 앱" : exe },
    h("h3", {}, star ? "모든 앱 (*)" : exe, h("span", { class: "grow" }), presetSel,
      star ? null : h("button", { class: "btn danger", disabled: busy, "aria-label": exe + " 삭제", onclick: () => { const n = { ...state.apps }; delete n[exe]; saveApps(n); } }, "삭제")),
    h("div", { class: "sum" }, sum.length ? sum.map((t) => h("span", {}, t)) : h("span", { class: "none" }, star ? "특별한 규칙 없음 — 기본 동작" : "모두 ‘기본’ — 모든 앱 규칙을 따릅니다")),
    h("div", { class: "fields" }, sel("enabled", "사용"), thSel, sel("escapeToApp", "Esc는 앱에게"), sel("useSystemIme", "시스템 IME"), sel("fullWidth", "일본어 전각")));
}

let runningApps = null;
async function loadRunning() {
  if (runningApps) return;
  try { runningApps = (await api("/api/processes")).apps; } catch (e) { runningApps = []; }
  const list = $("running"); if (list) list.replaceChildren(...runningApps.filter((a) => !state.apps[a]).map((a) => h("option", { value: a })));
}

function renderApps() {
  const p = $("p-apps"); p.replaceChildren();
  p.append(h("p", { class: "note" }, "앱 실행 파일 이름(대소문자 무시)마다 규칙을 정합니다. ‘기본’은 ‘모든 앱’ 항목을 따릅니다. 터미널은 변환 기준을 엄격하게, 게임은 끄는 식으로 씁니다."));
  const input = h("input", { type: "text", id: "newapp", list: "running", placeholder: "예: windowsterminal.exe", "aria-label": "앱 실행 파일 이름", autocomplete: "off", onfocus: loadRunning });
  const preset = h("select", { "aria-label": "처음 적용할 프리셋" }, h("option", { value: "" }, "프리셋 없음"), PRESETS.map((x, i) => h("option", { value: i }, x[0])));
  const add = () => {
    const n = input.value.trim().toLowerCase();
    if (!n) return;
    if (!/^[^\\/:*?"<>|]+$/.test(n)) { toast("파일 이름만 적어 주세요 (경로 없이)", true); return; }
    if (state.apps[n]) { toast("이미 있는 앱입니다", true); return; }
    saveApps({ ...state.apps, [n]: preset.value === "" ? {} : { ...PRESETS[preset.value][1] } }, "app-" + n + "-th");
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  const exes = ["*", ...Object.keys(state.apps).filter((k) => k !== "*").sort()];
  p.append(h("div", { class: "apps" }, exes.map((e) => appCard(e, state.apps[e] || {}))));
  const list = h("datalist", { id: "running" }, (runningApps || []).filter((a) => !state.apps[a]).map((a) => h("option", { value: a })));
  p.append(h("div", { class: "card pad add" }, h("b", {}, "앱 추가"),
    h("div", { class: "note", style: "margin:4px 0 0" }, "칸을 누르면 지금 실행 중인 프로그램이 제안됩니다."),
    h("div", { class: "pair" }, input, preset, h("button", { class: "btn primary", disabled: busy, onclick: add }, "추가")), list));
}

function renderUpdate() {
  const p = $("p-upd"); p.replaceChildren();
  p.append(h("h2", {}, "현재 버전"), h("div", { class: "card pad" }, h("b", {}, "Typescript " + state.version)));
  p.append(h("h2", {}, "새 버전"));
  const box = h("div", { class: "card pad", "aria-busy": busy && pending === "upd" });
  if (!updateInfo) box.append(h("p", { class: "note" }, "GitHub 릴리스에서 새 버전과 언어 팩 갱신을 확인합니다."));
  else if (updateInfo.error) box.append(h("p", { class: "note", role: "alert" }, updateInfo.error));
  else if (!updateInfo.available) box.append(h("p", { class: "note" }, "최신 버전입니다."));
  else {
    box.append(h("b", {}, updateInfo.latest + " 이(가) 나왔습니다"));
    if (updateInfo.notes) box.append(h("pre", { class: "note", style: "white-space:pre-wrap" }, updateInfo.notes));
    box.append(h("button", { class: "btn primary", disabled: busy, onclick: applyUpdate }, updateInfo.coreChanged ? "업데이트 (관리자 확인창이 한 번 뜹니다)" : "언어 팩 업데이트"));
  }
  box.append(h("div", { style: "margin-top:14px" }, h("button", { class: "btn", "data-f": "upd-check", disabled: busy, onclick: checkUpdate }, busy && pending === "upd" ? "확인 중…" : "지금 확인")));
  p.append(box);
}

async function checkUpdate() {
  busy = true; pending = "upd"; render("upd-check");
  try { updateInfo = await api("/api/update"); } catch (e) { updateInfo = { error: e.message }; }
  busy = false; pending = null; render("upd-check");
}
async function applyUpdate() {
  busy = true; pending = "upd"; render();
  try { const r = await api("/api/update", { action: "apply" }); toast(r.message || "업데이트했습니다"); updateInfo = null; state = await api("/api/state"); }
  catch (e) { toast(e.message, true); }
  busy = false; pending = null; render();
}

// ---- 체험: type on a QWERTY keyboard, see what each word becomes.
const tryState = { text: "", app: "*", seq: 0, timer: 0, order: "" };
const SAMPLES = [["dkssudgktpdy hello world", "한글 + 영어"], ["rkskek git commit -m", "코드 사이에서"], ["kyouhaiitenkidesune", "일본어", "ja"]];

function threshold() {
  const r = (state.apps[tryState.app] || {}), star = state.apps["*"] || {};
  return r.conversionThreshold !== undefined ? r.conversionThreshold : star.conversionThreshold;
}

function scheduleTry() { clearTimeout(tryState.timer); tryState.timer = setTimeout(runTry, 180); }

async function runTry() {
  const out = $("try-out"), list = $("try-words");
  if (!out) return;
  const mine = ++tryState.seq;
  if (!tryState.text.trim()) { out.replaceChildren(h("span", { class: "meta" }, "위에 영문 자판으로 쳐 보세요.")); list.replaceChildren(); return; }
  let r;
  try { r = await api("/api/try", { text: tryState.text, ...(threshold() !== undefined ? { threshold: threshold() } : {}) }); }
  catch (e) { if (mine === tryState.seq) out.replaceChildren(h("span", { class: "meta", role: "alert" }, e.message)); return; }
  if (mine !== tryState.seq) return; // a newer keystroke is already on its way
  const words = r.segments.filter((s) => s.keys);
  out.replaceChildren(...r.segments.map((s) => s.keys
    ? h("span", { class: "w l-" + s.lang + (s.kept ? " kept" : ""), title: s.keys + (s.kept ? " — 확신이 부족해 그대로 둠" : "") }, s.out)
    : document.createTextNode(s.text)));
  list.replaceChildren(...words.map((s) => h("div", { class: "wr" },
    h("span", { class: "k" }, s.keys),
    h("span", {}, "→ " + s.out + (s.kept ? " (그대로 둠)" : "")),
    h("span", { class: "conf" }, langName(s.lang) + " · " + Math.round(s.confidence * 100) + "%"))));
}

function buildTry() {
  const p = $("p-try");
  const area = h("textarea", { id: "try-in", rows: 3, spellcheck: "false", autocomplete: "off", "aria-label": "영문 자판으로 친 글", placeholder: "예: dkssudgktpdy hello world",
    oninput: (e) => { tryState.text = e.target.value; scheduleTry(); } });
  const app = h("select", { id: "try-app", "aria-label": "적용할 앱 규칙", onchange: (e) => { tryState.app = e.target.value; scheduleTry(); } });
  const chips = h("div", { class: "chips", id: "try-chips" });
  p.append(h("p", { class: "note" }, "한/영 전환 없이 영문 자판 그대로 쳐 보세요. 입력기가 단어마다 어느 언어로 읽는지 그대로 보여 줍니다. 아무 곳에도 저장되지 않습니다."),
    h("div", { class: "card pad" }, h("label", { for: "try-in", class: "field" }, "입력"), area, chips,
      h("div", { class: "add", style: "margin-top:14px" }, h("label", { class: "field", style: "max-width:260px" }, "앱 규칙 적용", app))),
    h("h2", {}, "결과"),
    h("div", { class: "card pad" }, h("div", { class: "out", id: "try-out", "aria-live": "polite" }), h("div", { class: "legend", id: "try-legend" }), h("div", { class: "words", id: "try-words" })),
    h("p", { class: "note", style: "margin-top:16px" }, "실제 입력에서는 앞 단어와 기록한 단어, Esc·Tab 같은 키도 영향을 줍니다. 여기서는 단어 읽기만 보여 줍니다."));
}

function updateTry() {
  const app = $("try-app"), chips = $("try-chips");
  if (!app) return;
  const names = ["*", ...Object.keys(state.apps).filter((k) => k !== "*").sort()];
  if (!names.includes(tryState.app)) tryState.app = "*";
  app.replaceChildren(...names.map((n) => h("option", { value: n, selected: n === tryState.app }, n === "*" ? "모든 앱" : n)));
  chips.replaceChildren(...SAMPLES.filter((s) => !s[2] || state.order.includes(s[2])).map((s) => h("button", { class: "btn chip", onclick: () => { $("try-in").value = s[0]; tryState.text = s[0]; runTry(); $("try-in").focus(); } }, s[0] + "  · " + s[1])));
  const colors = { en: "영어", ko: "한국어", ja: "일본어" };
  $("try-legend").replaceChildren(...state.order.map((id) => h("span", {}, h("i", { class: "w l-" + id }), colors[id] || id)), h("span", {}, "점선 = 확신이 부족해 그대로 둠"));
  const order = state.order.join();
  if (order !== tryState.order) { tryState.order = order; runTry(); }
}

function render(focusKey) {
  if (!state) return;
  $("ver").textContent = "v" + state.version;
  const active = focusKey || (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f);
  renderLang(); renderSettings(); renderApps(); renderUpdate(); updateTry();
  if (active) { const el = document.querySelector('[data-f="' + CSS.escape(active) + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}

const tabs = ["t-lang", "t-try", "t-set", "t-apps", "t-upd"], panels = ["p-lang", "p-try", "p-set", "p-apps", "p-upd"];
function select(i, focus) {
  tabs.forEach((t, k) => { $(t).setAttribute("aria-selected", k === i); $(t).tabIndex = k === i ? 0 : -1; $(panels[k]).hidden = k !== i; });
  if (focus) $(tabs[i]).focus();
  history.replaceState(null, "", "/#" + tabs[i].slice(2));
  if (i === 1 && state) runTry();
}
tabs.forEach((t, i) => {
  $(t).addEventListener("click", () => select(i, true));
  $(t).addEventListener("keydown", (e) => {
    const to = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); select(to, true); }
  });
});

async function beat() {
  try { await api("/api/heartbeat", {}); $("dot").className = "dot"; $("linktext").textContent = "연결됨"; }
  catch (e) { $("dot").className = "dot off"; $("linktext").textContent = "끊어짐 — 터미널에서 다시 여세요"; }
}
setInterval(beat, 5000);

(async () => {
  buildTry();
  const start = tabs.indexOf("t-" + location.hash.slice(1));
  if (start > 0) select(start, false);
  try { state = await api("/api/state"); render(); }
  catch (e) { $("p-lang").replaceChildren(h("div", { class: "banner bad", role: "alert" }, e.message + " 터미널에서 typescript-config 를 다시 실행해 주세요.")); }
})();
</script>
</body>
</html>
