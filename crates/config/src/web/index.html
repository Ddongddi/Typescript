<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tacit</title>
<style>
<!--styles-->
</style>
</head>
<body>
<a class="skip" href="#panels">본문으로 건너뛰기</a>

<main>
  <header class="top">
    <h1>Tacit</h1>
    <span class="ver" id="ver"></span>
    <a class="linkbtn" href="/welcome">튜토리얼</a>
    <p class="tagline">영문 자판 그대로 치면, 단어마다 영어·한국어<!--language:ja-->·일본어<!--language:/ja-->를 알아서 골라 줍니다.</p>
    <p class="link" role="status"><span class="dot" id="dot"></span><span id="linktext">연결됨</span></p>
  </header>
  <p class="banner bad" id="expired" role="alert" hidden></p>
  <div class="banner bad" id="load-error" role="alert" hidden></div>
  <p id="save-status" role="status" aria-live="polite"></p>
  <p class="banner" id="ime" role="status" hidden></p>
  <div class="banner" id="setup" hidden></div>

  <div class="shell">
  <div class="left">
  <nav role="tablist" aria-label="설정">
    <button role="tab" id="t-lang" aria-controls="p-lang" aria-selected="true">언어</button>
    <button role="tab" id="t-set" aria-controls="p-set" aria-selected="false" tabindex="-1">입력 설정</button>
    <button role="tab" id="t-keys" aria-controls="p-keys" aria-selected="false" tabindex="-1">키</button>
    <button role="tab" id="t-apps" aria-controls="p-apps" aria-selected="false" tabindex="-1">앱별 규칙</button>
    <button role="tab" id="t-upd" aria-controls="p-upd" aria-selected="false" tabindex="-1">업데이트</button>
  </nav>

  <div id="panels">
    <section id="p-lang" role="tabpanel" aria-labelledby="t-lang" tabindex="-1">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
    <section id="p-set" role="tabpanel" aria-labelledby="t-set" tabindex="-1" hidden></section>
    <section id="p-keys" role="tabpanel" aria-labelledby="t-keys" tabindex="-1" hidden></section>
    <section id="p-apps" role="tabpanel" aria-labelledby="t-apps" tabindex="-1" hidden></section>
    <section id="p-upd" role="tabpanel" aria-labelledby="t-upd" tabindex="-1" hidden></section>
  </div>

  <footer class="keys" aria-label="단축키">
    <span><kbd>1</kbd>–<kbd>5</kbd> 탭</span>
    <span><kbd>/</kbd> 앱 찾기</span>
    <span><kbd>Esc</kbd> 언어 탭에서 순환 보기</span>
  </footer>
  </div>
  <aside class="pane" id="chat-pane" aria-label="테스트"></aside>
  </div>
</main>
<button class="btn test-jump" id="test-jump" type="button">테스트 열기 ↓</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
<!--scripts-->
</script>
</body>
</html>
