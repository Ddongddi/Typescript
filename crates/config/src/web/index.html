<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Typescript</title>
<style>
<!--styles-->
</style>
</head>
<body>
<a class="skip" href="#panels">본문으로 건너뛰기</a>

<main>
  <header class="top">
    <h1>Typescript</h1>
    <span class="ver" id="ver"></span>
    <p class="tagline">영문 자판 그대로 치면, 단어마다 영어·한국어·일본어를 알아서 골라 줍니다.</p>
    <p class="link" role="status"><span class="dot" id="dot"></span><span id="linktext">연결됨</span></p>
  </header>

  <nav role="tablist" aria-label="설정">
    <button role="tab" id="t-lang" aria-controls="p-lang" aria-selected="true">언어</button>
    <button role="tab" id="t-try" aria-controls="p-try" aria-selected="false" tabindex="-1">체험</button>
    <button role="tab" id="t-set" aria-controls="p-set" aria-selected="false" tabindex="-1">입력 설정</button>
    <button role="tab" id="t-apps" aria-controls="p-apps" aria-selected="false" tabindex="-1">앱별 규칙</button>
    <button role="tab" id="t-upd" aria-controls="p-upd" aria-selected="false" tabindex="-1">업데이트</button>
  </nav>

  <div id="panels">
    <section id="p-lang" role="tabpanel" aria-labelledby="t-lang" tabindex="-1">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
    <section id="p-try" role="tabpanel" aria-labelledby="t-try" tabindex="-1" hidden></section>
    <section id="p-set" role="tabpanel" aria-labelledby="t-set" tabindex="-1" hidden></section>
    <section id="p-apps" role="tabpanel" aria-labelledby="t-apps" tabindex="-1" hidden></section>
    <section id="p-upd" role="tabpanel" aria-labelledby="t-upd" tabindex="-1" hidden></section>
  </div>

  <footer class="keys" aria-label="단축키">
    <span><kbd>1</kbd>–<kbd>5</kbd> 탭</span>
    <span><kbd>/</kbd> 앱 찾기</span>
    <span><kbd>Esc</kbd> 언어 탭에서 순환 보기</span>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
<!--scripts-->
</script>
</body>
</html>
