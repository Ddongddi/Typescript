[package]
name = "typescript-config"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/Typescript"

[lib]
name = "typescript_config"

[[bin]]
name = "typescript-config"
path = "src/main.rs"

[dependencies]
typescript-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
tiny_http = "0.12"
getrandom = "0.3"
dialoguer = { version = "0.11", default-features = false }

[dev-dependencies]
typescript-packgen = { path = "../packgen" }
