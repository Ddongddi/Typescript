[package]
name = "typescript-config"
version = "0.4.0"
edition = "2021"

[lib]
name = "typescript_config"

[[bin]]
name = "typescript-config"
path = "src/main.rs"

[dependencies]
typescript-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
tiny_http = "0.12"
dialoguer = { version = "0.11", default-features = false }
