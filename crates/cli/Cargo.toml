[package]
name = "typescript-cli"
version = "0.6.4"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/Typescript"

[[bin]]
name = "typescript"
path = "src/main.rs"

[features]
# Embeds the Japanese pack too (16 MB), for tuning without installing it.
japanese = ["typescript-core/embedded-ja"]

[dependencies]
typescript-core = { path = "../core", features = ["embedded-en", "embedded-ko"] }
