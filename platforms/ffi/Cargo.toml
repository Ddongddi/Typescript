[package]
name = "typescript-ffi"
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/Typescript"
description = "C interface of the input method for the macOS and Linux text services"

[lib]
name = "typescript_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
typescript-android = { path = "../android/native" }
typescript-core = { path = "../../crates/core", features = ["embedded-en", "embedded-ko"] }
