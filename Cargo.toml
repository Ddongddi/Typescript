[workspace]
members = ["crates/core", "crates/packgen", "crates/config", "crates/cli", "platforms/windows", "platforms/android/native", "platforms/ffi"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Symbols ship in the separate .pdb files; stripping the binaries changes nothing at runtime.
strip = true
# panic stays "unwind": the TIP catches panics at the COM boundary.

# The core engine at "s": measured (lab, 3 runs each) 3% slower per decision (21.8 vs 21.0 µs)
# for a 12% smaller TIP (896 vs 1023 KB). "z" is 35% slower, so not that.
[profile.release.package.typescript-core]
opt-level = "s"

# Not latency-sensitive: smaller without behaving any differently. The TIP stays at
# opt-level 3.
[profile.release.package.typescript-config]
opt-level = "z"
[profile.release.package.typescript-cli]
opt-level = "z"
[profile.release.package.typescript-packgen]
opt-level = "z"
