# Measurement lab, versioned on its own (CHANGELOG.md here): not a member of the root workspace or the release build or
# packaging scripts, so nothing here reaches an installer. Own lockfile and target dir.
#   cargo run --release --manifest-path lab/Cargo.toml
[package]
name = "tacit-lab"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
tacit-core = { path = "../crates/core", features = ["embedded-en", "embedded-ko", "embedded-ja", "tuning"] }

# Same as the shipped engine (root Cargo.toml), so the timings mean what users get.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.tacit-core]
opt-level = "s"
