name: Release

# Push a tag like v0.2.0 to publish a release with the installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        edition: [enko, enkoja]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # Not together with tacit-cli (a development tool, not packaged): its embedded packs
      # would end up in these two as well (+2.5 MB each, unused: they read the installed packs).
      - name: Build desktop binaries for the selected languages
        run: |
          $features = if ('${{ matrix.edition }}' -eq 'enkoja') { @('--features', 'tacit-tip/japanese,tacit-config/japanese') } else { @() }
          cargo build --release -p tacit-tip -p tacit-config @features
          if ($LASTEXITCODE) { throw 'desktop build failed' }
      - name: Build x86 text service
        run: |
          $features = if ('${{ matrix.edition }}' -eq 'enkoja') { @('--features', 'japanese') } else { @() }
          cargo build --release -p tacit-tip --target i686-pc-windows-msvc @features
          if ($LASTEXITCODE) { throw 'x86 build failed' }
      - run: cargo install cargo-ndk --locked
      - name: Build the APK (signed with the release key)
        if: matrix.edition == 'enko'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:TS_KEYSTORE_PASS) { throw 'ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing' }
          $env:TS_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($env:TS_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          ./platforms/android/build.ps1 -Abi arm64-v8a
      - run: ./scripts/package.ps1 -Edition ${{ matrix.edition }}
      - run: Copy-Item platforms/android/build/tacit.apk dist/
        if: matrix.edition == 'enko'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.edition }}
          path: dist/*

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        edition: [enko, enkoja]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: IBus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libibus-1.0-dev pkg-config zip
      - run: cargo test --workspace --all-features --exclude tacit-tip
      - run: sh scripts/package.sh ${{ runner.os == 'Linux' && 'linux' || 'macos' }} ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ matrix.edition }}
          path: dist/*

  publish:
    needs: [release, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Installs from before 0.10 only know the old asset names and stop at "the release has no
      # typescript-windows.zip". Keep a copy under those names until they have all moved on.
      - name: Keep the pre-rename asset names for older installs
        run: python3 scripts/legacy-assets.py dist "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the version's entry in CHANGELOG.md; GitHub writes them if it has none.
          if sh scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md; then
            notes="--notes-file notes.md"
          else
            notes="--generate-notes"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" $notes
