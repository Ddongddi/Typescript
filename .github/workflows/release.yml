name: Release

# Push a tag like v0.2.0 to publish a release with the installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p typescript-tip -p typescript-cli -p typescript-config
      - run: cargo build --release -p typescript-tip --target i686-pc-windows-msvc
      - run: cargo install cargo-ndk --locked
      - name: Build the APK (signed with the release key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:TS_KEYSTORE_PASS) { throw 'ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing' }
          $env:TS_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($env:TS_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          ./platforms/android/build.ps1 -Abi arm64-v8a
      - run: ./scripts/package.ps1
      - run: Copy-Item platforms/android/build/typescript.apk dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: IBus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libibus-1.0-dev pkg-config zip
      - run: cargo test --workspace --exclude typescript-tip
      - run: cargo build --release -p typescript-cli -p typescript-config -p typescript-ffi
      - run: ./scripts/package.sh ${{ runner.os == 'Linux' && 'linux' || 'macos' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*

  publish:
    needs: [release, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
