name: Release

# Push a tag like v0.2.0 to publish a release with the installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --features typescript-core/japanese,typescript-tip/japanese,typescript-cli/japanese
      - run: cargo build --release -p typescript-tip -p typescript-cli
      - run: cargo build --release -p typescript-tip --target i686-pc-windows-msvc
      # The edition with Japanese (English + Korean + Japanese): its own target dir, its own zip.
      - run: cargo build --release -p typescript-tip -p typescript-cli --features typescript-tip/japanese,typescript-cli/japanese --target-dir target-ja
      - run: cargo build --release -p typescript-tip --features typescript-tip/japanese --target i686-pc-windows-msvc --target-dir target-ja
      - run: cargo install cargo-ndk --locked
      - name: Build the APK (signed with the release key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:TS_KEYSTORE_PASS) { throw 'ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing' }
          $env:TS_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($env:TS_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          ./platforms/android/build.ps1 -Abi arm64-v8a
      - run: ./scripts/package.ps1
      - run: Copy-Item platforms/android/build/typescript.apk dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/* --title "$env:GITHUB_REF_NAME" --generate-notes
