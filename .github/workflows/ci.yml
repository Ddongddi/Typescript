name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: npx --yes prettier@3.3.3 --check "crates/config/src/web/**/*.{js,css}" ".github/**/*.yml"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: powershell -NoProfile -File scripts/test-language-isolation.ps1
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The 32-bit text service loads into 32-bit apps, so it has to keep building.
      - run: cargo build --release -p tacit-tip --target i686-pc-windows-msvc

  # Linux and macOS: the engine, the tools and the C interface (the Windows text service does
  # not build there), then the input method itself.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: IBus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libibus-1.0-dev pkg-config zip
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude tacit-tip --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tacit-tip
      - run: cargo test --workspace --exclude tacit-tip --all-features
      - run: sh scripts/test-language-isolation.sh
      - run: cargo clippy --workspace --exclude tacit-tip --all-targets --all-features -- -D warnings
      - name: Test macOS composition context
        if: runner.os == 'macOS'
        run: sh platforms/macos/test.sh
      - name: Package (builds the IBus engine / the macOS input method too)
        run: |
          sh scripts/package.sh ${{ runner.os == 'Linux' && 'linux' || 'macos' }}

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: ./platforms/android/build.ps1

  japanese:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/build_mozc.py --selftest
      - run: python lab/evaluate_japanese.py --selftest
      - run: cargo test --manifest-path lab/Cargo.toml
      - run: sh lab/report.sh --profile enko --selftest
      - run: sh lab/report.sh --profile enkoja --selftest
      - run: cargo build --release --manifest-path lab/Cargo.toml
      - run: python lab/evaluate_japanese.py --binary lab/target/release/tacit-lab --check
      - run: python lab/compare_japanese_preview.py --binary lab/target/release/tacit-lab --runs 1 --out temp/japanese-preview.json
