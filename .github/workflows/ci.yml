name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The edition with Japanese carries 17 MB of models and has its own tests.
      - run: cargo clippy --workspace --all-targets --features typescript-core/japanese,typescript-tip/japanese,typescript-cli/japanese -- -D warnings
      - run: cargo test --workspace --features typescript-core/japanese,typescript-tip/japanese,typescript-cli/japanese
      # The 32-bit text service loads into 32-bit apps, so it has to keep building.
      - run: cargo build --release -p typescript-tip --target i686-pc-windows-msvc
      - run: cargo build --release -p typescript-tip --features typescript-tip/japanese --target i686-pc-windows-msvc --target-dir target-ja

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: ./platforms/android/build.ps1
